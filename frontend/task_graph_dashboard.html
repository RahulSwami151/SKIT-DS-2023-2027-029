<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIM - Task Graph Dashboard</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --primary: #4f46e5;
        --primary-soft: rgba(79, 70, 229, 0.12);
        --secondary: #10b981;
        --warning: #f59e0b;
        --text: #111827;
        --muted: #6b7280;
        --line: #dbe3f0;
        --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8f9ff);
        color: var(--text);
      }

      .page {
        max-width: 1200px;
        margin: 32px auto;
        padding: 24px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      .btn {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: var(--shadow);
      }

      .btn:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
      }

      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip {
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.82rem;
        font-weight: 600;
      }

      .dashboard {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 620px;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        padding: 20px 18px;
        background: #fcfcff;
      }

      .task-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .task-item {
        padding: 14px 12px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: white;
        cursor: pointer;
        transition: border-color 160ms ease, transform 160ms ease;
      }

      .task-item:hover,
      .task-item.selected {
        border-color: var(--primary);
        transform: translateX(3px);
      }

      .task-item h3 {
        margin: 0 0 6px;
        font-size: 0.98rem;
      }

      .meta {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .status {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .status.reading { background: #dbeafe; color: #1d4ed8; }
      .status.assignment { background: #dcfce7; color: #15803d; }
      .status.project { background: #fef3c7; color: #b45309; }
      .status.quiz { background: #fce7f3; color: #9d174d; }

      .graph-panel {
        position: relative;
        padding: 16px;
        background: linear-gradient(180deg, #ffffff, #f7f8ff);
      }

      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }

      .graph-box {
        width: 100%;
        height: 520px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: radial-gradient(circle at top, #ffffff 0%, #f6f8ff 100%);
        overflow: hidden;
      }

      svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .task-node {
        cursor: pointer;
      }

      .task-node circle {
        stroke: white;
        stroke-width: 3;
        filter: drop-shadow(0 8px 12px rgba(79, 70, 229, 0.18));
      }

      .task-node text {
        font-weight: 700;
        font-size: 12px;
        fill: #1f2937;
      }

      .task-node .subtitle {
        font-size: 11px;
        fill: var(--muted);
        font-weight: 600;
      }

      .edge-label {
        font-size: 11px;
        fill: var(--muted);
        font-weight: 600;
      }

      .graph-message {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .task-details {
        margin-top: 18px;
        padding: 14px;
        border-left: 3px solid var(--primary);
        background: var(--primary-soft);
        border-radius: 0 10px 10px 0;
        font-size: 0.84rem;
      }

      .task-details strong {
        display: block;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <h1>Task Dependency Graph</h1>
        <button class="btn" id="generateGraph" type="button">Generate Graph</button>
      </div>

      <div class="panel">
        <div class="toolbar">
          <div class="filters">
            <span class="chip">Dashboard</span>
            <span class="chip">Priority view</span>
            <span class="chip">Dependency map</span>
          </div>
          <span class="graph-message" id="graphMessage" role="status">Showing demo data</span>
        </div>

        <div class="dashboard">
          <aside class="sidebar">
            <ul class="task-list" id="taskList"></ul>
            <div class="task-details" id="taskDetails">Select a task to inspect its connections.</div>
          </aside>

          <main class="graph-panel">
            <div class="legend">
              <div class="legend-item"><span class="dot" style="background:#4f46e5;"></span>Priority / main flow</div>
              <div class="legend-item"><span class="dot" style="background:#10b981;"></span>Supporting task</div>
              <div class="legend-item"><span class="dot" style="background:#f59e0b;"></span>Dependency link</div>
            </div>

            <div class="graph-box">
              <svg id="graphSvg" viewBox="0 0 820 500" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
          </main>
        </div>
      </div>
    </div>

    <script>
      const demoGraphData = {
        nodes: [
          { id: 1, title: 'Read Ch.5', task_type: 'reading', subject: 'DBMS' },
          { id: 2, title: 'DBMS Assignment', task_type: 'assignment', subject: 'DBMS' },
          { id: 3, title: 'Project Proposal', task_type: 'project', subject: 'AI' },
          { id: 4, title: 'Quiz Revision', task_type: 'quiz', subject: 'ML' },
          { id: 5, title: 'Final Review', task_type: 'exam', subject: 'CS' }
        ],
        edges: [
          { source: 2, target: 1, reason: 'Needs reading summary' },
          { source: 3, target: 1, reason: 'Uses key concepts' },
          { source: 4, target: 1, reason: 'Based on chapter notes' },
          { source: 5, target: 2, reason: 'Assignment prepares exam' },
          { source: 5, target: 3, reason: 'Project supports final review' }
        ]
      };

      const taskTypeColors = {
        reading: '#4f46e5',
        assignment: '#10b981',
        project: '#f59e0b',
        quiz: '#ec4899',
        exam: '#8b5cf6'
      };

      const nodePositions = {
        1: { x: 200, y: 150 },
        2: { x: 420, y: 120 },
        3: { x: 640, y: 210 },
        4: { x: 300, y: 330 },
        5: { x: 560, y: 360 }
      };

      const sidebar = document.getElementById('taskList');
      const svg = document.getElementById('graphSvg');
      const details = document.getElementById('taskDetails');
      const message = document.getElementById('graphMessage');
      const generateButton = document.getElementById('generateGraph');
      let graphData = demoGraphData;
      let selectedTaskId = null;

      function createSvgElement(name, attributes = {}) {
        const element = document.createElementNS('http://www.w3.org/2000/svg', name);
        Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
        return element;
      }

      function selectTask(taskId) {
        selectedTaskId = taskId;
        const task = graphData.nodes.find((node) => node.id === taskId);
        if (!task) return;

        const dependencies = graphData.edges.filter(
          (edge) => edge.source === taskId || edge.target === taskId
        );
        details.replaceChildren();
        const title = document.createElement('strong');
        title.textContent = task.title;
        details.appendChild(title);
        details.append(
          `${task.subject || 'No subject'} · ${dependencies.length} connection${dependencies.length === 1 ? '' : 's'}`
        );
        renderGraph();
      }

      function getNodePosition(taskId, index) {
        if (nodePositions[taskId]) return nodePositions[taskId];
        const column = index % 3;
        const row = Math.floor(index / 3);
        return { x: 150 + column * 260, y: 110 + row * 180 };
      }

      function renderSidebar() {
        sidebar.replaceChildren();
        graphData.nodes.forEach((task) => {
          const item = document.createElement('li');
          item.className = `task-item${task.id === selectedTaskId ? ' selected' : ''}`;
          item.tabIndex = 0;
          item.innerHTML = `<h3></h3><div class="meta"></div><span class="status"></span>`;
          item.querySelector('h3').textContent = task.title;
          item.querySelector('.meta').textContent = task.subject || 'No subject';
          const status = item.querySelector('.status');
          status.textContent = task.task_type;
          status.classList.add(task.task_type);
          item.addEventListener('click', () => selectTask(task.id));
          item.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') selectTask(task.id);
          });
          sidebar.appendChild(item);
        });
      }

      function renderGraph() {
        svg.replaceChildren();
        const defs = createSvgElement('defs');
        const marker = createSvgElement('marker', {
          id: 'arrowhead', markerWidth: 12, markerHeight: 12, refX: 10, refY: 6, orient: 'auto'
        });
        marker.appendChild(createSvgElement('path', { d: 'M0,0 L0,12 L12,6 z', fill: '#94a3b8' }));
        defs.appendChild(marker);
        svg.appendChild(defs);

        graphData.edges.forEach((edge) => {
          const from = getNodePosition(edge.source, graphData.nodes.findIndex((node) => node.id === edge.source));
          const to = getNodePosition(edge.target, graphData.nodes.findIndex((node) => node.id === edge.target));
          const connected = selectedTaskId === null || edge.source === selectedTaskId || edge.target === selectedTaskId;
          svg.appendChild(createSvgElement('line', {
            x1: from.x, y1: from.y, x2: to.x, y2: to.y,
            stroke: connected ? '#94a3b8' : '#dbe3f0', 'stroke-width': connected ? 2.5 : 1.5,
            'stroke-linecap': 'round', 'marker-end': 'url(#arrowhead)', opacity: connected ? 0.9 : 0.35
          }));
          const label = createSvgElement('text', {
            x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 - 10,
            'text-anchor': 'middle', class: 'edge-label', opacity: connected ? 1 : 0.25
          });
          label.textContent = edge.reason || 'Dependency';
          svg.appendChild(label);
        });

        graphData.nodes.forEach((task) => {
          const pos = getNodePosition(task.id, graphData.nodes.indexOf(task));
          const node = createSvgElement('g', { class: 'task-node', tabindex: 0, opacity: selectedTaskId === null || selectedTaskId === task.id ? 1 : 0.4 });
          node.addEventListener('click', () => selectTask(task.id));
          const circle = createSvgElement('circle', { cx: pos.x, cy: pos.y, r: 46, fill: taskTypeColors[task.task_type] || '#64748b' });
          const title = createSvgElement('text', { x: pos.x, y: pos.y + 4, 'text-anchor': 'middle' });
          title.textContent = task.title.split(' ')[0];
          const subtitle = createSvgElement('text', { x: pos.x, y: pos.y + 24, 'text-anchor': 'middle', class: 'subtitle' });
          subtitle.textContent = task.subject || '';
          node.append(circle, title, subtitle);
          svg.appendChild(node);
        });
        renderSidebar();
      }

      async function loadGraph() {
        generateButton.disabled = true;
        message.textContent = 'Generating dependency graph...';
        try {
          const detectResponse = await fetch('/students/1/detect-dependencies', { method: 'POST' });
          if (!detectResponse.ok) throw new Error('Dependency detection failed');
          const graphResponse = await fetch('/students/1/dependency-graph');
          if (!graphResponse.ok) throw new Error('Graph loading failed');
          graphData = await graphResponse.json();
          selectedTaskId = null;
          message.textContent = `Live data · ${graphData.nodes.length} tasks · ${graphData.edges.length} connections`;
          renderGraph();
        } catch (error) {
          message.textContent = 'API unavailable · showing demo data';
          graphData = demoGraphData;
          selectedTaskId = null;
          renderGraph();
        } finally {
          generateButton.disabled = false;
        }
      }

      generateButton.addEventListener('click', loadGraph);
      renderGraph();
    </script>
  </body>
</html>
